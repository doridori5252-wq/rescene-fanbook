# 하루 두 번(한국 시간 아침 7시·저녁 7시) 위키백과 수상·음악방송 1위와 공식 유튜브 새 영상을 확인해 data.json을 최신으로 고쳐요.
# 바뀐 게 있을 때만 커밋하고, 앱은 켤 때마다 이 data.json(GitHub Pages)을 받아 새 정보를 보여 줘요.
name: 최신 정보 자동 갱신
on:
  schedule:
    - cron: "0 22,10 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/update_data.py
      - name: 바뀐 것이 있으면 올리기
        run: |
          if git diff --quiet data.json; then echo "바뀐 것 없음"; exit 0; fi
          cp data.json app/www/data.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json app/www/data.json
          git commit -m "수상 기록 자동 갱신 ($(date -u +%Y-%m-%d))"
          git push
